name: Stage 2 cloud checks

on:
  push:
    branches: [feature/cloud-deployment-stage2]
  pull_request:

jobs:
  python-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend

  node-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check app.js && node --check api/status.js && npm test
        working-directory: web

  docker-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t voicebridge-pay-sandbox:stage2 backend/
